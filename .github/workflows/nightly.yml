# Full gate, run BY HAND only (no schedule - a daily run would spend the
# monthly Actions budget in under two weeks). The release gate tier - every
# debug suite including the script's SLOW_BINARIES, the ui suites from
# crates/ui, clippy, then the --ignored heavy lanes of camcraft-motion and
# camcraft-app in release. Push / PR CI runs only the batch tier (ci.yml).
# Provenance: our own build law; mirrors the AGENTS.md testing layout.
name: Nightly
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release-tier:
    name: release tier (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Release gate tier
        shell: pwsh
        run: ./scripts/gate.ps1 -Tier release
      - name: Gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs-release
          path: gate-logs/
          if-no-files-found: ignore
