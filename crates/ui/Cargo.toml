[package]
name = "camcraft-ui"
description = "egui shell: docked panels, entity tree, ribbon, 3D viewport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
camcraft-app = { workspace = true }
flecs_ecs = { workspace = true }
winit = { workspace = true }
rfd = { workspace = true }
pollster = { workspace = true }
image = { workspace = true }
# The shell stack (M1.4.2): egui + its winit/wgpu adapters + the dock
# area. egui_wgpu re-exports wgpu - the unified workspace wgpu - so
# viewport.rs and the renderer agree on types without a second dep line.
egui = { workspace = true }
egui-winit = { workspace = true }
egui-wgpu = { workspace = true }
egui_dock = { workspace = true }

[dev-dependencies]
# egui's own test harness, for the frame tests in the lib (egui_app) -
# the point is to run the SAME shell_layout code the window runs.
egui_kittest = { workspace = true }

[[bin]]
name = "camcraft-ui"
path = "src/main.rs"
